# Render Blueprint - documents the backend service config so it's
# reproducible from the repo rather than only living in dashboard clicks.
# Secret values are NOT here (sync: false means "set this in the Render
# dashboard, don't read a value from this file") - see README.md's
# deployment section for what each one is.
services:
  - type: web
    name: second-brain-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # sentence-transformers/torch (embeddings.py) are memory-hungry - free
    # tier's 512MB is a real OOM risk, especially on first model load.
    # Fine for light solo testing; upgrade to "starter" in the dashboard
    # if it crashes under real usage. Free tier also sleeps after 15min
    # idle, so the first request after a gap is slow (30-60s cold start).
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
