<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyConfía Video Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fdfbf7; --ink:#1c1917; --muted:#6b645a; --accent:#ea580c; --amber:#f5a524; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e9e4da; font-family: 'Geist', -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.render { background: var(--paper); overflow: hidden; }
  #wrap { position: relative; width: 1080px; height: 1350px; transform-origin: top left; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
  body:not(.render) #wrap { box-shadow: 0 30px 80px rgba(0,0,0,.18); border-radius: 18px; overflow: hidden; }

  .grain { pointer-events:none; opacity:.35; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .w { display:inline-block; white-space:nowrap; }
  .acc { color: var(--accent); }
  .mk { position: relative; z-index: 0; }
  .mk::after { content:''; position:absolute; left:-6px; right:-6px; bottom:6%; height:34%; background: var(--amber); opacity:.55; z-index:-1; border-radius:6px;
    transform-origin:left; transform: scaleX(var(--mk, 0)); }

  .card { background:#fff; border-radius:30px; box-shadow: 0 1px 2px rgba(40,30,20,.05), 0 14px 40px rgba(40,30,20,.10); border:1px solid rgba(40,30,20,.06); }
  .task { display:flex; gap:22px; align-items:flex-start; padding:26px 30px; }
  .task .ttl { font-weight:650; letter-spacing:-0.02em; line-height:1.2; position:relative; display:inline-block; }
  .task .ttl::after { content:''; position:absolute; left:0; top:55%; height:3px; width:100%; background:#a39d92; transform-origin:left; transform:scaleX(var(--strike,0)); }
  .metas { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .meta { display:inline-flex; align-items:center; gap:8px; font-size:22px; font-weight:600; color:var(--muted); background:#f4f1eb; padding:6px 14px; border-radius:99px; white-space:nowrap; }
  .meta .dot { width:12px; height:12px; border-radius:50%; }
  .check { width:44px; height:44px; border-radius:50%; border:3.5px solid var(--accent); flex:none; margin-top:2px; display:flex; align-items:center; justify-content:center; }
  .check svg { opacity:0; }
  .check.on { background: currentColor; }
  .check.on svg { opacity:1; }
  .note { padding:26px 30px; }

  .chip { display:inline-flex; align-items:center; gap:10px; padding:10px 22px; border-radius:99px; font-weight:650; white-space:nowrap; letter-spacing:-0.01em; }
  .kicker { padding:12px 26px; border-radius:99px; font-size:26px; font-weight:650; letter-spacing:0.01em; white-space:nowrap; }
  .tile { border-radius:32px; padding:26px 28px; box-sizing:border-box; }

  .phone { background:#1c1917; border-radius:70px; box-shadow: 0 40px 90px rgba(28,25,23,.32), inset 0 0 0 2px #3a3532; }
  .screen { background: var(--paper); border-radius:56px; overflow:hidden; }
  .browser { background:#fff; border-radius:22px; overflow:hidden; box-shadow: 0 40px 100px rgba(28,25,23,.25); border:1px solid rgba(40,30,20,.1); }
  .tl { display:inline-block; width:15px; height:15px; border-radius:50%; }

  .toast { display:flex; gap:22px; align-items:center; padding:22px 26px; border-radius:36px; background:rgba(255,255,255,.92);
    backdrop-filter: blur(20px); box-shadow: 0 30px 70px rgba(28,25,23,.22); border:1px solid rgba(40,30,20,.06); }
  .toast svg rect { rx: 120; }

  .capture { display:flex; align-items:center; gap:18px; padding:16px 16px 16px 32px; background:#fff; border-radius:99px; box-shadow: 0 16px 50px rgba(40,30,20,.13); border:2px solid rgba(234,88,12,.25); }
  .cmic { border-radius:50%; background: var(--accent); display:flex; align-items:center; justify-content:center; flex:none; }
  .caret { display:inline-block; width:3px; height:1.05em; background: var(--accent); vertical-align:-0.15em; margin-left:2px; border-radius:2px; }

  .cta { display:flex; align-items:center; gap:16px; padding:28px 52px; border-radius:99px; background: var(--accent); color:#fff; font-size:42px; font-weight:700; letter-spacing:-0.02em; white-space:nowrap;
    box-shadow: 0 20px 50px rgba(234,88,12,.4); }

  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

  /* preview UI */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display:flex; gap:14px; align-items:center; padding:14px 20px; background:rgba(28,25,23,.92); color:#fff; font-size:15px; z-index:10; }
  #ui button { background:#ea580c; color:#fff; border:0; border-radius:99px; padding:9px 18px; font:600 15px 'Geist', sans-serif; cursor:pointer; }
  #ui input[type=range] { flex:1; accent-color:#ea580c; }
  #ui a { color:#f5c08a; }
  body.render #ui { display:none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="ui">
  <button id="play">▶ Play with sound</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time" class="mono">0.0s</span>
  <a href="../index.html">← Campaign</a>
</div>
<script type="module">
  import { buildAudio, encodeWav } from './audio.js';
  import { makeCues } from './engine.js';

  const params = new URLSearchParams(location.search);
  const name = params.get('v') || 'intro';
  const render = params.has('render');
  if (render) document.body.classList.add('render');

  const mod = await import(`./videos/${name}.js`);
  const def = mod.default;
  const stage = document.getElementById('stage');
  const { list, cue } = makeCues();
  const update = def.build(stage, cue);
  const spec = { duration: def.duration, music: def.music, cues: list, seed: def.seed ?? 11 };

  await document.fonts.ready;
  update(0);

  window.__video = {
    duration: def.duration,
    poster: def.poster ?? def.duration - 1.5,
    seek: t => update(t),
    async renderAudio() {
      const sr = 48000;
      const ctx = new OfflineAudioContext(2, Math.ceil(sr * def.duration), sr);
      buildAudio(ctx, spec, 0);
      const buf = await ctx.startRendering();
      const bytes = encodeWav(buf);
      let s = ''; const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      return btoa(s);
    },
  };
  window.__ready = true;

  if (!render) {
    const wrap = document.getElementById('wrap');
    const fit = () => {
      const s = Math.min((innerWidth - 40) / 1080, (innerHeight - 100) / 1350);
      wrap.style.transform = `scale(${s})`;
      wrap.style.margin = `20px auto 0`;
      wrap.style.left = `${(innerWidth - 1080 * s) / 2 - 0}px`;
      wrap.style.position = 'absolute';
      wrap.style.margin = '0'; wrap.style.top = '20px';
    };
    fit(); addEventListener('resize', fit);
    const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), btn = document.getElementById('play');
    let playing = false, t0 = 0, actx = null;
    const tick = () => {
      if (!playing) return;
      const t = actx.currentTime - t0;
      if (t >= def.duration) { playing = false; btn.textContent = '↻ Replay'; update(def.duration); return; }
      update(t); seekEl.value = t / def.duration * 1000; timeEl.textContent = t.toFixed(1) + 's';
      requestAnimationFrame(tick);
    };
    btn.onclick = async () => {
      if (actx) await actx.close();
      actx = new AudioContext();
      t0 = actx.currentTime + 0.08;
      buildAudio(actx, spec, t0);
      playing = true; btn.textContent = '■ Playing…';
      requestAnimationFrame(tick);
    };
    seekEl.oninput = () => {
      playing = false; if (actx) { actx.close(); actx = null; } btn.textContent = '▶ Play with sound';
      const t = seekEl.value / 1000 * def.duration; update(t); timeEl.textContent = t.toFixed(1) + 's';
    };
  }
</script>
</body>
</html>
