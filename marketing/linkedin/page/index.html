<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyConfía Page Posts</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f1eb; --card:#fff; --ink:#1c1917; --muted:#6b645a; --line:rgba(40,30,20,.1); --accent:#ea580c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Geist', -apple-system, sans-serif; }
  header { max-width:1180px; margin:0 auto; padding:40px 16px 8px; }
  h1 { font-size:36px; letter-spacing:-0.03em; margin:0 0 6px; }
  header p { color:var(--muted); margin:4px 0; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 0; }
  .filters button { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:8px 16px; font:600 14px 'Geist'; cursor:pointer; }
  .filters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:1180px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:20px; }
  .post { background:var(--card); border:1px solid var(--line); border-radius:20px; display:grid; grid-template-columns:360px 1fr; gap:24px; padding:20px; }
  .media { display:flex; flex-direction:column; gap:10px; }
  .media img, .media video { width:100%; border-radius:12px; display:block; background:#ddd; aspect-ratio:4/5; object-fit:cover; }
  .strip { display:flex; gap:6px; overflow-x:auto; }
  .strip img { width:72px; aspect-ratio:4/5; border-radius:6px; flex:none; }
  .links { display:flex; gap:12px; flex-wrap:wrap; font-size:14px; }
  .links a { color:var(--accent); font-weight:600; text-decoration:none; }
  .meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--muted); }
  .badge { background:#fde6d6; color:#9a3412; font-weight:700; border-radius:99px; padding:4px 10px; }
  .hook { font-size:20px; font-weight:700; letter-spacing:-0.02em; margin:10px 0; }
  pre { white-space:pre-wrap; font:15px/1.5 'Geist'; background:#faf8f4; border:1px solid var(--line); border-radius:12px; padding:16px; margin:0; max-height:420px; overflow:auto; }
  .tags { color:#0a66c2; font-weight:600; }
  .copy { margin-top:10px; background:var(--ink); color:#fff; border:0; border-radius:99px; padding:10px 18px; font:600 14px 'Geist'; cursor:pointer; }
  .note { font-size:13px; color:var(--muted); margin-top:8px; }
  @media (max-width:820px) { .post { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>MyConfía · LinkedIn page posts</h1>
  <p id="cad"></p>
  <p>Run <code>node serve.mjs</code> in <code>marketing/linkedin</code>, then open <code>localhost:4173/page/</code>.</p>
  <div class="filters" id="f"></div>
</header>
<main id="list"></main>
<script type="module">
  import { posts, schedule } from './posts.js';
  document.getElementById('cad').textContent = schedule.cadence;
  const KIND = { video: '🎬 Video', image: '🖼️ Image', carousel: '📑 Carousel' };
  const slides = { 'p03-how-it-works': 6, 'p06-claude-setup': 5 };
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const media = p => {
    if (p.kind === 'video') return `<video src="${p.media}" poster="${p.thumb}" controls playsinline preload="none"></video>
      <div class="links"><a href="${p.media}" download>⬇ Video</a><a href="${p.thumb}" download>⬇ Thumbnail</a></div>`;
    if (p.kind === 'carousel') { const d = p.media.replace('.pdf', ''); const n = slides[p.id];
      return `<img src="${d}/slide-1.png"><div class="strip">${Array.from({ length: n }, (_, i) => `<img src="${d}/slide-${i + 1}.png">`).join('')}</div>
      <div class="links"><a href="${p.media}" download>⬇ PDF</a></div>`; }
    return `<img src="${p.media}"><div class="links"><a href="${p.media}" download>⬇ Image</a></div>`;
  };
  const list = document.getElementById('list');
  const render = k => {
    list.innerHTML = posts.filter(p => k === 'all' || p.kind === k).map(p => `
      <article class="post"><div class="media">${media(p)}</div><div>
        <div class="meta"><span class="badge">${KIND[p.kind]}</span><span>${p.when}</span><span>· ${p.series}</span></div>
        <div class="hook">${esc(p.hook)}</div>
        <pre>${esc(p.body)}\n\n<span class="tags">${p.hashtags.join(' ')}</span></pre>
        <button class="copy" data-id="${p.id}">Copy post</button>
        ${p.docTitle ? `<div class="note">Document title: <b>${esc(p.docTitle)}</b></div>` : ''}
        ${p.comment ? `<div class="note">First comment: <b>${esc(p.comment)}</b></div>` : ''}
      </div></article>`).join('');
  };
  const f = document.getElementById('f');
  [['all', 'All 23'], ['video', 'Videos'], ['image', 'Images'], ['carousel', 'Carousels']].forEach(([k, l], i) => {
    const b = document.createElement('button'); b.textContent = l; if (!i) b.className = 'on';
    b.onclick = () => { f.querySelectorAll('button').forEach(x => x.className = ''); b.className = 'on'; render(k); }; f.append(b);
  });
  list.addEventListener('click', async e => {
    const b = e.target.closest('.copy'); if (!b) return;
    const p = posts.find(x => x.id === b.dataset.id);
    try { await navigator.clipboard.writeText(`${p.body}\n\n${p.hashtags.join(' ')}`); b.textContent = 'Copied ✓'; } catch { b.textContent = 'Copy failed'; }
    setTimeout(() => { b.textContent = 'Copy post'; }, 1500);
  });
  render('all');
</script>
</body>
</html>
