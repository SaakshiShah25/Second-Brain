# Sends the push notifications: the 9 AM / 5 PM task summary and the reminders set on individual
# tasks (a day and a time). Every 5 minutes this asks the backend what is due - the backend works
# out each device's own local time and sends each thing at most once (see push_notify.py), so
# running often is harmless, and a reminder arrives within about 5 minutes of the time chosen.
#
# It also keeps the free Render service awake (it sleeps after 15 idle minutes), so the app's
# first request after a quiet spell is fast.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   RENDER_API_URL - the deployed backend's base URL, e.g. https://second-brain-api-ot22.onrender.com
#   CRON_SECRET    - must match the CRON_SECRET env var set on Render
#
# GitHub may start scheduled runs a few minutes late, or skip one when it is busy; a reminder
# simply goes out on the next run that happens (and a missed day is still delivered for 3 days).
# 5 minutes is the shortest schedule GitHub allows. Public repos have unlimited Actions minutes; on
# a PRIVATE repo 288 runs a day would use the 2,000 free minutes in about a week, so use a longer
# interval there (or a Supabase pg_cron job calling the same endpoint).
name: Task reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}  # run it by hand from the Actions tab to test

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        run: |
          # --retry covers the free server waking up from sleep (the first attempt can time out)
          response=$(curl -s -w '\n%{http_code}' --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/api/push/send-due" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "HTTP status: $status"
          echo "Response body: $body"
          if [ "$status" -ge 400 ]; then
            echo "::error::Request failed with status $status - $body"
            exit 1
          fi
