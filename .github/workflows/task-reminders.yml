# MANUAL ONLY. Reminders are now sent by a Supabase pg_cron job every minute
# (scripts/migration_39_reminder_cron.sql), which also keeps the free Render service awake.
# This workflow stays as a way to fire one tick by hand from the Actions tab when testing.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   RENDER_API_URL - the deployed backend's base URL, e.g. https://second-brain-api-ot22.onrender.com
#   CRON_SECRET    - must match the CRON_SECRET env var set on Render
name: Task reminders (manual)

on:
  workflow_dispatch: {}  # run it by hand from the Actions tab to test

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        run: |
          # --retry covers the free server waking up from sleep (the first attempt can time out)
          response=$(curl -s -w '\n%{http_code}' --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/api/push/send-due" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "HTTP status: $status"
          echo "Response body: $body"
          if [ "$status" -ge 400 ]; then
            echo "::error::Request failed with status $status - $body"
            exit 1
          fi
